<div id="app"><div id="scr"></div><div id="nav"></div></div>
<script>
/* ============================================================
   MICRO-GESTES — v32
   À personnaliser avant mise en ligne : les 4 lignes ci-dessous.
   ============================================================ */
var CFG={
  site:'https://yannriguidelhypnose.fr',
  livre:'https://yannriguidelhypnose.fr',   // ← remplacer par l'URL Amazon du livre
  appUrl:'https://micro-gestes.netlify.app',// ← l'URL publique de l'appli
  ville:'Lorient',
  codeTest:'LECTEUR2026' // ← code d'accès de la phase de test (sera remplacé par le formulaire)
};

var S={scr:'w',tab:'j',parcours:null,deg:3,mode:'rdv',day:1,done:[],memos:{},fb:{},fbd:{},releve:{},remind:'08:00',q:[],qi:0,qorder:null,vday:null,qhist:[],seuils:[],fin:0,cycle:1,arch:[]};
/* =====================================================================
   DONNÉES — format versionné (schéma 2)
   Règles : on n'efface jamais une ancienne clé ; toute conversion passe par
   MIGR ; on ne remplace jamais des données plus récentes que l'application.
   ===================================================================== */
var APP_VERSION='1.1.1', SCHEMA=2, CLE='mg-donnees', CLE_ANCIENNE='pp24';
/* Champs d'écran : jamais enregistrés ni exportés */
var EPHEMERES=['scr','tab','q','qi','qorder','vday','again','ans','exaequo','finalistes','second','tour','sc','sc1'];
/* Champs rangés dans l'enveloppe */
var RANGES=['persoL','parcours','deg','mode','day','done','memos','fb','fbd','releve','remind','seuils','fin','cycle','arch','qhist'];
var META={creeLe:null,derniereSauvegarde:null,acces:null,migreDe:null,rappelMasque:null};
var BLOQUE_ECRITURE=false, ALERTE_DONNEES=null;

function maintenant(){return new Date().toISOString();}
function copieSecours(nom,valeur){try{if(valeur&&!localStorage.getItem('mg-secours-'+nom))localStorage.setItem('mg-secours-'+nom,valeur);}catch(e){}}

/* Données « à plat » (format de l'application) -> enveloppe schéma 2 */
function enveloppeDepuis(d,meta){
  meta=meta||{};var autres={};
  for(var k in d){if(EPHEMERES.indexOf(k)<0&&RANGES.indexOf(k)<0)autres[k]=d[k];}
  return {
    format:'micro-gestes',schema:SCHEMA,appVersion:APP_VERSION,
    creeLe:meta.creeLe||maintenant(),modifieLe:maintenant(),migreDe:meta.migreDe||null,
    acces:meta.acces||null,
    reglages:{rythme:d.mode||'rdv',heureRdv:d.remind||'08:00',degre:d.deg||3,derniereSauvegarde:meta.derniereSauvegarde||null,rappelSauvegardeMasque:meta.rappelMasque||null},
    cycleEnCours:{numero:d.cycle||1,parcours:d.parcours||null,jour:d.day||1,
      gestesFaits:Array.isArray(d.done)?d.done:[],notes:d.memos||{},
      avisGestes:d.fb||{},avisGestesJour:d.fbd||{},releve:d.releve||{},
      passagesVus:Array.isArray(d.seuils)?d.seuils:[],fin:d.fin||0},
    cyclesArchives:Array.isArray(d.arch)?d.arch:[],
    questionnaires:Array.isArray(d.qhist)?d.qhist:[],
    selectionPerso:d.persoL||null,
    autres:autres
  };
}
/* Enveloppe schéma 2 -> données « à plat » */
function aplatir(e){
  var c=e.cycleEnCours||{},r=e.reglages||{},d={};
  var a=e.autres||{};for(var k in a)d[k]=a[k];
  d.parcours=c.parcours||null;d.day=c.jour||1;d.done=c.gestesFaits||[];d.memos=c.notes||{};
  d.fb=c.avisGestes||{};d.fbd=c.avisGestesJour||{};d.releve=c.releve||{};d.seuils=c.passagesVus||[];
  d.fin=c.fin||0;d.cycle=c.numero||1;d.arch=e.cyclesArchives||[];d.qhist=e.questionnaires||[];
  d.mode=r.rythme||'rdv';d.remind=r.heureRdv||'08:00';d.deg=r.degre||3;
  if(e.selectionPerso)d.persoL=e.selectionPerso;
  return d;
}
/* Chaîne de migrations : MIGR[n] transforme le schéma n en schéma n+1.
   Schéma 1 = l'ancien format « pp24 » (données à plat, sans version). */
var MIGR={
  1:function(e){return enveloppeDepuis(e.donnees||{},{migreDe:e.migreDe||'pp24'});}
};
function migrer(e){
  while(e.schema<SCHEMA){
    if(!MIGR[e.schema])throw new Error('Migration manquante depuis le schéma '+e.schema);
    if(e.schema>1)copieSecours('schema-'+e.schema,JSON.stringify(e));
    var creeLe=e.creeLe;e=MIGR[e.schema](e);if(creeLe)e.creeLe=creeLe;
  }
  return e;
}
function appliquer(e){
  var d=aplatir(e);for(var k in d)S[k]=d[k];
  META.creeLe=e.creeLe||null;META.acces=e.acces||null;META.migreDe=e.migreDe||null;
  META.derniereSauvegarde=(e.reglages&&e.reglages.derniereSauvegarde)||null;
  META.rappelMasque=(e.reglages&&e.reglages.rappelSauvegardeMasque)||null;
  if(S.parcours)S.scr='home';
}
function enveloppeActuelle(){return enveloppeDepuis(S,META);}
function sv(){
  if(BLOQUE_ECRITURE)return;
  if(S.parcours&&!(META.acces&&META.acces.deverrouille))META.acces={deverrouille:true,methode:'utilisateur-existant',le:maintenant()};
  try{var e=enveloppeActuelle();META.creeLe=e.creeLe;localStorage.setItem(CLE,JSON.stringify(e));}catch(err){}
}
function ld(){
  var brut=null,e=null;
  try{brut=localStorage.getItem(CLE);}catch(err){}
  try{
    if(brut){
      e=JSON.parse(brut);
      if(!e||e.format!=='micro-gestes'||typeof e.schema!=='number')throw new Error('format inconnu');
      if(e.schema>SCHEMA){
        /* Données venant d'une version plus récente : on ne les écrase pas. */
        BLOQUE_ECRITURE=true;
        ALERTE_DONNEES='Vos données viennent d’une version plus récente de l’application. Rechargez la page avec une connexion pour la mettre à jour. Rien n’a été modifié.';
      }else if(e.schema<SCHEMA){copieSecours('schema-'+e.schema,brut);e=migrer(e);}
    }else{
      var ancien=null;try{ancien=localStorage.getItem(CLE_ANCIENNE);}catch(err){}
      if(ancien){
        copieSecours(CLE_ANCIENNE,ancien); /* l'ancienne clé reste aussi en place */
        var d=JSON.parse(ancien);
        if(d&&d.parcours)e=migrer({schema:1,donnees:d,migreDe:CLE_ANCIENNE});
      }
    }
    if(e&&!BLOQUE_ECRITURE){appliquer(e);sv();}
    else if(e){appliquer(e);}
  }catch(err){
    /* Échec : on garde tout intact et on prévient, au lieu de repartir de zéro. */
    BLOQUE_ECRITURE=true;
    if(brut)copieSecours('illisible-'+Date.now(),brut);
    ALERTE_DONNEES='Vos données n’ont pas pu être lues. Elles sont conservées sur ce téléphone, rien n’a été effacé. Vous pouvez restaurer une sauvegarde depuis les Réglages.';
  }
  S.vday=null;
  if(!S.seuils)S.seuils=[];if(!S.fbd)S.fbd={};if(!S.releve)S.releve={};if(!S.arch)S.arch=[];if(!S.cycle)S.cycle=1;
  if(S.persoL&&S.persoL.C){IND.perso={lb:'Votre sélection',sl:'Vos gestes retenus',sym:0,C:S.persoL.C,P:S.persoL.P,E:S.persoL.E};}
  if(S.parcours&&!IND[S.parcours])S.parcours='sur';
}
/* Demande au navigateur de ne pas effacer les données (stockage durable) */
function demanderStockageDurable(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(ok){if(!ok)navigator.storage.persist();});}catch(e){}
}

var G={
C02:{n:'Respiration ventrale',a:'C',c:'Une main sur le ventre. Inspirez par le nez en gonflant le ventre, expirez lentement par la bouche, plus longuement.',d:'1–2 min',br:1},
C05:{n:'Cohérence cardiaque',a:'C',c:'Inspirez 5 secondes, expirez 5 secondes, sans pause. Laissez le rythme s’installer.',d:'3 min',br:1},
C12:{n:'Décontraction éclair',a:'C',c:'Contractez tout le corps quelques secondes, puis relâchez d’un coup en expirant.',d:'45 sec'},
C13:{n:'Pompage des épaules',a:'C',c:'Poings fermés, haussez les épaules en inspirant, soufflez fort en relâchant. Deux à trois fois.',d:'1 min'},
C14:{n:'Étirement cervical',a:'C',c:'Inclinez doucement l’oreille vers l’épaule, sans la lever. Quinze secondes de chaque côté.',d:'1 min'},
C15:{n:'Décrispation du visage',a:'C',c:'Relâchez le front, les sourcils, la mâchoire, la langue. Trente secondes.',d:'45 sec',ch:1},
C16:{n:'Mains chaudes sur les yeux',a:'C',c:'Frottez vos paumes, posez-les en coupe sur vos yeux fermés. Vingt secondes.',d:'45 sec'},
C17:{n:'Posture de récupération',a:'C',c:'Allongé, jambes pliées, mains sur le ventre. Respirez lentement.',d:'2 min'},
C18:{n:'Ancrage 5-4-3-2-1',a:'C',c:'Nommez 5 choses vues, 4 entendues, 3 touchées, 2 senties, 1 goûtée.',d:'2 min',ch:1},
C19:{n:'Étreinte papillon',a:'C',c:'Bras croisés, mains sur les épaules, tapotez en alternance gauche-droite, lentement.',d:'1 min',ch:1},
C20:{n:'Pieds enracinés',a:'C',c:'Sentez vos appuis au sol, le poids qui descend, comme des racines.',d:'1 min',ch:1},
C21:{n:'Balayage des appuis',a:'C',c:'Parcourez mentalement les points où votre corps touche le siège et le sol.',d:'1 min'},
H01:{n:'Ancrage au lavage des mains',a:'C',c:'La prochaine fois que vous vous laverez les mains, sentez l’eau et relâchez les épaules.',d:'30 sec'},
P01:{n:'« Je suis en train de penser que… »',a:'P',c:'Repérez la pensée qui pèse, reformulez : « je remarque que je pense que… ».',d:'1 min',ch:1},
P02:{n:'Feuilles sur le ruisseau',a:'P',c:'Posez chaque pensée sur une feuille et regardez-la s’éloigner au fil de l’eau.',d:'2 min'},
P03:{n:'Nuages dans le ciel',a:'P',c:'Vos pensées sont des nuages qui passent ; vous êtes le ciel, inchangé.',d:'2 min'},
P04:{n:'Mot répété',a:'P',c:'Prenez un mot dur, répétez-le doucement une vingtaine de fois. Il perd son sens.',d:'1 min'},
P05:{n:'Pensées dans les mains',a:'P',c:'Mains devant les yeux (la pensée occupe tout), puis éloignez-les lentement.',d:'2 min'},
P06:{n:'Sas de décharge',a:'P',c:'Écrivez sans filtre ce qui occupe la tête, sans vous relire. À la fin, vous déposez — rien n’est conservé.',d:'5 min',sas:1},
P07:{n:'Une seule priorité',a:'P',c:'Écrivez LA chose qui compte aujourd’hui. Une seule. Le reste est bonus.',d:'1 min'},
P08:{n:'Inventaire des « urgences »',a:'P',c:'Listez trois « urgences ». Pour chacune : que se passerait-il vraiment si c’était demain ?',d:'2 min'},
P09:{n:'Une tâche, en pleine conscience',a:'P',c:'Choisissez un geste banal et faites-le en y portant toute votre attention.',d:'2 min'},
P10:{n:'Trois choses qui vont',a:'P',c:'Notez trois choses, même minuscules, qui ont été correctes aujourd’hui.',d:'1 min'},
P11:{n:'Tempo ralenti',a:'P',c:'Faites votre prochaine action à moitié de votre vitesse habituelle.',d:'1–2 min'},
P12:{n:'Phrase de permission',a:'P',c:'Dites-vous : « je n’ai pas besoin de tout faire aujourd’hui pour avoir de la valeur ».',d:'1 min'},
E01:{n:'Objet-limite',a:'E',c:'Posez en vue un objet qui dit « stop ». Le voir, c’est respirer.',d:'1 min'},
E02:{n:'Geste accroché à un repère',a:'E',c:'Adossez un micro-geste à un moment déjà là : « après mes clés posées, trois respirations ».',d:'1 min'},
E03:{n:'Signal de pause',a:'E',c:'Choisissez un signal récurrent qui vous rappellera de relâcher les épaules.',d:'1 min'},
E04:{n:'Rendre facile',a:'E',c:'Préparez le terrain du geste à l’avance : tapis déroulé, carnet ouvert.',d:'2 min'},
E05:{n:'Rendre difficile',a:'E',c:'Pour ce qui vous happe, ajoutez un obstacle : téléphone dans une autre pièce.',d:'2 min'},
E08:{n:'Coin de recharge',a:'E',c:'Repérez un endroit où vous vous sentez bien. Passez-y quelques minutes.',d:'1 min'},
E09:{n:'Un élément de calme',a:'E',c:'Modifiez un détail de votre espace pour qu’il invite au repos.',d:'2 min'},
E10:{n:'Sas de transition',a:'E',c:'Entre deux activités, accordez-vous soixante secondes de rien.',d:'1 min'},
E11:{n:'Rituel de fin de journée',a:'E',c:'Un geste net qui marque la fin du « mode travail ».',d:'1 min'},
E12:{n:'Couvre-feu des écrans',a:'E',c:'Trente minutes avant de dormir, plus d’écran — une activité calme.',d:'1 min'},
C22:{n:'Le soupir physiologique',a:'C',c:'Inspirez normalement, puis ajoutez une deuxième petite inspiration par le nez pour remplir complètement les poumons. Expirez ensuite lentement et complètement par la bouche, aussi longtemps que possible. Une seule répétition suffit souvent.',d:'1 min',br:1,ch:1},
C23:{n:'Expiration doublée',a:'C',c:'Inspirez en comptant jusqu’à quatre. Expirez en comptant jusqu’à huit. Si huit est trop long, faites trois et six. Une dizaine de cycles.',d:'2 min',br:1},
C24:{n:'Dix minutes dehors',a:'C',c:'Sortez et marchez dix minutes dans un endroit qui a un peu de vert. Sans téléphone, sans destination.',d:'10 min'},
C25:{n:'Le geste avant l’envie',a:'C',c:'Quand l’envie monte, posez la main là où vous la sentez — gorge, poitrine, ventre — et respirez en gardant l’attention à cet endroit. Regardez-la monter, tenir, redescendre.',d:'2 min',ch:1},
P13:{n:'Se parler par son prénom',a:'P',c:'Reprenez ce qui vous préoccupe, mais en vous adressant à vous-même par votre prénom, à la deuxième personne. Non pas « pourquoi est-ce que je rate tout », mais « qu’est-ce qui se passe pour toi ? ».',d:'1 min',ch:1},
P14:{n:'Le rendez-vous des soucis',a:'P',c:'Fixez un créneau de quinze minutes, toujours au même moment, réservé à vos soucis. En dehors, notez-les d’un mot et dites-vous : ce n’est pas l’heure.',d:'1 min'},
P15:{n:'Ce que je dirais à un autre',a:'P',c:'Prenez ce que vous venez de vous reprocher. Dites-vous exactement ce que vous diriez à un ami qui vous raconterait la même chose.',d:'2 min'},
P16:{n:'La main sur soi',a:'P',c:'Posez une main sur votre poitrine. Nommez ce qui est difficile. Ajoutez : c’est un moment dur, et beaucoup de gens connaissent ça. Puis : de quoi j’aurais besoin, là ?',d:'1 min',ch:1},
P17:{n:'Agir avant d’en avoir envie',a:'P',c:'Choisissez une action que vous feriez si vous alliez bien, et faites-la maintenant, sans attendre d’en avoir envie. Petite.',d:'2 min'},
P18:{n:'Choisir sur ce qui compte',a:'P',c:'Avant de décider de votre journée, posez-vous une seule question : qu’est-ce qui compte pour moi ? Puis choisissez une action qui va dans ce sens, quoi que vous ressentiez.',d:'2 min'},
E13:{n:'Le plan si-alors',a:'E',c:'Écrivez une phrase, une seule : « Si [situation précise], alors je [action précise]. » Par exemple : « Si je pose mes clés en rentrant, alors je fais trois soupirs. »',d:'2 min'},
E14:{n:'Le si-alors de l’obstacle',a:'E',c:'Repérez ce qui fait le plus souvent échouer votre geste. Écrivez : « Si [l’obstacle survient], alors je [réponse préparée]. »',d:'2 min'},
E15:{n:'Le si-alors de la tentation',a:'E',c:'Écrivez : « Si [le déclencheur apparaît], alors je [geste de remplacement]. » Par exemple : « Si j’ouvre le placard sans faim, alors je bois un verre d’eau et je change de pièce. »',d:'2 min'},
E16:{n:'Vingt secondes de plus',a:'E',c:'Ajoutez vingt secondes d’effort à ce qui vous happe : téléphone dans une autre pièce, aliment rangé en hauteur. Puis retirez-en vingt à ce que vous voulez faire.',d:'2 min'},
E17:{n:'Dire une chose vraie',a:'E',c:'Aujourd’hui, dites une seule chose que vous auriez tue. Petite. Un avis, une préférence, un non sur un sujet mineur. Choisissez-la à l’avance, et choisissez-la facile.',d:'2 min'},
E18:{n:'Une chose pour quelqu’un',a:'E',c:'Faites une petite chose pour quelqu’un, sans l’annoncer et sans attendre de réponse.',d:'2 min'},
T01:{n:'Le test d’une heure',a:'P',c:'Ralentissez vraiment pendant une heure aujourd’hui. Avant, écrivez ce que vous craignez qu’il arrive. Après, écrivez ce qui est réellement arrivé.',d:'3 min'},
T02:{n:'Poser sa tête un soir',a:'P',c:'Ce soir, arrêtez de tourner le sujet. Écrivez d’abord ce que vous craignez de rater en arrêtant. Demain matin, relisez et vérifiez.',d:'3 min'},
T03:{n:'Deux minutes en présence',a:'P',c:'Approchez ce que vous évitez et restez-y deux minutes, sans rien faire d’autre. Notez de 0 à 10 avant d’entrer, et au moment de sortir.',d:'3 min'},
T04:{n:'Un besoin dit',a:'P',c:'Formulez un besoin à quelqu’un aujourd’hui. Un seul, petit. Écrivez avant ce que vous craignez, et après ce qui s’est passé.',d:'3 min'},
T05:{n:'Laisser passer la vague',a:'P',c:'Quand la tristesse monte, ne la coupez pas. Laissez-la monter, culminer, redescendre. Regardez l’heure au début et à la fin.',d:'3 min'},
T06:{n:'Finir une chose',a:'P',c:'Prenez quelque chose de presque terminé et terminez-le aujourd’hui. Écrivez avant ce que vous craignez que ça change.',d:'3 min'},
T07:{n:'Laisser le silence',a:'P',c:'Aujourd’hui, ne relancez pas. Ne sur-expliquez pas. Laissez un silence là où vous auriez comblé. Notez ce qui arrive au lien.',d:'3 min'},
T08:{n:'Le même traitement',a:'P',c:'Prenez ce que vous vous reprochez et traitez-vous exactement comme vous traiteriez un ami. Une seule fois, aujourd’hui. Notez ce que ça vous coûte.',d:'3 min'},
T09:{n:'Trente secondes avant de répondre',a:'P',c:'Quand quelque chose vous touche, attendez trente secondes avant de répondre. Comptez-les vraiment. Puis notez ce que vous auriez dit, et ce que vous avez dit.',d:'2 min',ch:1},
T10:{n:'Une préférence à contre-attente',a:'P',c:'Dites une préférence qui ne correspond pas à ce qu’on attend de vous. Petite. Écrivez avant ce que vous craignez, après ce qui est arrivé.',d:'3 min'},
T11:{n:'Prendre la place',a:'P',c:'Faites une chose qui vous rend visible : parler en premier, vous asseoir au milieu plutôt qu’au bord, poser une question devant les autres.',d:'3 min'},
T12:{n:'Trente secondes avant',a:'P',c:'Quand l’ordre intérieur arrive — « maintenant » —, attendez trente secondes avant d’y répondre. Regardez simplement ce que devient l’envie.',d:'2 min',ch:1},
O02:{n:'La respiration carrée',a:'C',c:'Inspirez sur quatre temps, retenez quatre temps, expirez quatre temps, retenez quatre temps. Recommencez.',d:'2 min',br:1},
O06:{n:'Se secouer les mains',a:'C',c:'Secouez les mains comme si vous vouliez les sécher sans serviette, quinze à vingt secondes. Debout, faites de même avec les pieds. Laissez le mouvement être ample et sans contrôle.',d:'45 sec'},
O07:{n:'Le scan corporel rapide',a:'C',c:'Yeux fermés si possible. Attention au sommet du crâne, puis descendez : visage, nuque, épaules, poitrine, ventre, bas du dos, hanches, jambes, pieds. Notez sans rien chercher à changer.',d:'2 min'},
O08:{n:'Le tapotement sternal',a:'C',c:'Deux ou trois doigts au centre du sternum. Tapotez doucement, à rythme régulier, vingt à trente secondes, en respirant lentement. L’intention compte autant que le geste.',d:'45 sec',ch:1},
O10:{n:'La réification',a:'P',c:'Yeux fermés. Prenez ce qui vous préoccupe et laissez-lui prendre une forme : une couleur, un volume, une texture, un poids, une température. Puis demandez-vous : si je pouvais modifier une seule chose dans cette forme, laquelle ?',d:'3 min'},
O13:{n:'Est-ce que ça comptera',a:'P',c:'Demandez-vous : est-ce que ça comptera encore dans trois heures ? Dans trois jours ? Dans trois mois ? Non pas pour minimiser, mais pour calibrer.',d:'1 min'},
O14:{n:'Le système de délai',a:'P',c:'Dès que l’envie d’agir monte, interposez un geste neutre avant de céder ou de résister : passer la langue sur vos dents, déplacer un objet, ranger quelque chose. Ce n’est pas une distraction, c’est un sas.',d:'1 min',ch:1},
O19:{n:'L’ancrage ressource',a:'C',c:'Yeux fermés. Rappelez un moment où vous vous êtes senti calme, fort, ancré. Laissez les images, les sons, les sensations se préciser. Quand vous y êtes, associez cet état à un geste — joindre le pouce et l’index, toucher votre avant-bras. Refait chaque jour, le geste suffira.',d:'3 min'},
S02:{n:'La facture cachée',a:'P',c:'Vous savez ce que changer coûterait. Écrivez plutôt ce que ça vous coûte, aujourd’hui, de ne pas changer. Une ligne, précise, sur cette semaine.',d:'2 min'},
S03:{n:'À quoi ça servait',a:'P',c:'Prenez une réaction d’aujourd’hui qui vous a échappé. Demandez-vous : à quel moment de ma vie est-ce que ça m’a été utile ? Ne cherchez pas à la corriger. Datez-la.',d:'2 min'},
S04:{n:'Le pacte',a:'E',c:'Beaucoup de nos conduites reposent sur un accord jamais dit : si je fais ceci, alors on me laisse tranquille. Écrivez le vôtre en une phrase. Avec qui, et sur quoi.',d:'3 min'},
S05:{n:'Le rendre facultatif',a:'E',c:'Prenez la conduite que vous voulez lâcher. Aujourd’hui, faites-la une fois en la choisissant délibérément. Demain, laissez-la une fois de côté. Le but n’est pas de l’enlever : c’est qu’elle redevienne un choix.',d:'2 min'},
S06:{n:'Un cran',a:'E',c:'Repérez votre niveau habituel sur une chose précise — le temps de travail, le volume de votre voix, la place que vous prenez. Déplacez-le d’un cran, dans un seul contexte, pour une seule occasion.',d:'2 min'},
S07:{n:'Le retour du thermostat',a:'P',c:'Après avoir fait quelque chose d’inhabituel, observez ce qui pousse à revenir en arrière : la fatigue, la justification, l’envie d’annuler. Nommez-le, sans lui obéir tout de suite.',d:'2 min'},
S08:{n:'Nommer la manœuvre',a:'P',c:'Quand quelque chose s’est déclenché aujourd’hui, nommez ce que vous avez fait : lutter, fuir, vous figer, vous couper, ruminer, ou pacifier. Nommer suffit.',d:'1 min',ch:1},
S09:{n:'Ce que ça apportait',a:'P',c:'Nommez une chose que la période d’avant vous apportait et qui n’est plus. Puis une seule chose, minuscule, qui pourrait en apporter un peu aujourd’hui.',d:'3 min'},
S10:{n:'Le coût du oui',a:'E',c:'Avant d’accepter quelque chose aujourd’hui, comptez jusqu’à trois. Pendant ces trois secondes, demandez-vous ce que ce oui va coûter cette semaine.',d:'1 min'}
};

function rot(list,w){return list[(w-1)%list.length];}
/* ROTATION (v34)
   - Le 1er geste de chaque liste est le geste-ancre du parcours : il revient un
     jour sur deux, parce que c'est la répétition qui installe.
   - Les autres tournent CHAQUE JOUR (et non plus chaque semaine).
   - Les gestes aimés (coeur) passent en tête de la rotation.
   - Un geste écarté (croix) sort à partir du lendemain. */
function ecarte(code,d){var j=S.fbd[code];return !!(j&&d>j);}
function pool(list,d){var ok=list.filter(function(c){return !ecarte(c,d);});return ok.length?ok:list;}
function prio(list){
  var aimes=[],autres=[];
  list.forEach(function(c){ (S.fb[c]===1?aimes:autres).push(c); });
  return aimes.concat(autres);
}
function slot(list,d,off){
  var pl=pool(list,d);
  if(pl.length<2)return pl[0];
  var anc=pl[0],rest=prio(pl.slice(1));
  if(off===0&&d%2===1)return anc;          // l'ancre un jour sur deux
  var k=Math.floor((d-1+off*3)/(off===0?2:1));
  return rest[((k%rest.length)+rest.length)%rest.length];
}
function todayGestes(d){
  d=d||S.day;
  var ind=IND[S.parcours],out=[];
  function add(c){if(c&&out.indexOf(c)<0)out.push(c);}
  var Cl=pool(ind.C,d);
  add(Cl[0]);                               // ancre Corps : tous les jours
  if(S.deg===1)return out;
  add(slot(ind.P,d,0));
  add(slot(ind.E,d,0));
  if(S.deg>=4)add(slot(ind.C,d,1));
  if(S.deg>=6){add(slot(ind.P,d,1));add(slot(ind.E,d,1));}
  return out;
}

/* ---------- Questionnaire ---------- */
/* QUESTIONNAIRE ADAPTATIF (v36)
   Tour 1 : les 12 items de dépistage, un par indication.
   Tour 2 : seules les 3 indications qui ressortent sont approfondies (2 items
   chacune). 18 questions au lieu de 30, et de la précision là où elle compte.

   Le score est IPSATIF : on retranche à chaque indication la moyenne de la
   personne. Quelqu'un qui approuve tout, ou qui n'approuve rien, n'est plus
   orienté au hasard — c'est son relief qui décide, pas son niveau général. */
function screeners(){var o=[];for(var i=0;i<QITEMS.length;i++)if(QITEMS[i].s)o.push(i);return o;}
function itemsDe(k){var o=[];for(var i=0;i<QITEMS.length;i++)if(QITEMS[i].k===k&&!QITEMS[i].s)o.push(i);return o;}
function melange(a){for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t;}return a;}

function startQuiz(again){
  S.qorder=melange(screeners());
  S.qi=0;S.ans=[];S.tour=1;S.again=again?1:0;S.sc1=null;S.finalistes=null;
  go('quiz');
}
function qitem(i){return QITEMS[S.qorder[i]];}

/* scores du tour 1 : une valeur brute par indication (0-3) */
function scoresTour1(){
  var o={};
  for(var i=0;i<S.qorder.length;i++){var it=QITEMS[S.qorder[i]];
    if(it.s)o[it.k]=(typeof S.ans[i]==='number')?S.ans[i]:0;}
  Object.keys(IND).forEach(function(k){if(o[k]==null)o[k]=0;});
  return o;
}
function moyenne(o){var s=0,n=0;for(var k in o){s+=o[k];n++;}return n?s/n:0;}

/* score final d'une indication : moyenne de ses items posés, moins la moyenne
   générale de la personne (ipsatif) */
function scoreFinal(){
  var sc1=S.sc1||scoresTour1(),m=moyenne(sc1),out={};
  Object.keys(IND).forEach(function(k){out[k]=sc1[k]-m;});
  if(S.finalistes){
    S.finalistes.forEach(function(k){
      var som=sc1[k],n=1;
      for(var i=0;i<S.qorder.length;i++){var it=QITEMS[S.qorder[i]];
        if(!it.s&&it.k===k&&typeof S.ans[i]==='number'){som+=S.ans[i];n++;}}
      out[k]=(som/n)-m;
    });
  }
  return out;
}
function classe(sc){
  return Object.keys(IND).sort(function(a,b){return sc[b]-sc[a];});
}

function qa(v){
  if(!S.ans)S.ans=[];
  S.ans[S.qi]=v;S.qi++;
  if(S.qi<S.qorder.length){render();return;}

  if(S.tour===1){
    S.sc1=scoresTour1();
    var brut=S.sc1,max=0;for(var k in brut)if(brut[k]>max)max=brut[k];
    if(max<1){                                   // rien ne ressort vraiment
      S.suggest=null;memoQuiz();go('rien');return;
    }
    var ord=Object.keys(IND).sort(function(a,b){return brut[b]-brut[a];});
    S.finalistes=ord.slice(0,3);
    var suite=[];
    S.finalistes.forEach(function(k){suite=suite.concat(itemsDe(k));});
    S.qorder=S.qorder.concat(melange(suite));
    S.tour=2;render();return;
  }

  var sc=scoreFinal(),ord=classe(sc);
  S.suggest=ord[0];S.second=ord[1];
  S.exaequo=(sc[ord[0]]-sc[ord[1]])<0.34;        // moins d'un tiers de point d'écart
  memoQuiz(sc);
  go(S.again?'compare':'result');
}
function memoQuiz(sc){
  if(!S.qhist)S.qhist=[];
  S.qhist.push({t:Date.now(),scores:S.sc1||scoresTour1(),suggest:S.suggest,cycle:S.cycle});
  sv();
}

function rQuiz(s){$('nav').innerHTML='';
  var n=S.qorder.length,it=qitem(S.qi);
  var cur=(S.ans&&typeof S.ans[S.qi]==='number')?S.ans[S.qi]:-1;
  var pct=Math.round(S.qi/n*100);
  var back=S.qi>0?'<button class="btn bs" style="font-size:13px;padding:11px;margin-top:6px" onclick="S.qi--;render()">Question précédente</button>':'';
  var tete=(S.tour===2&&S.qi===12)
    ? '<div class="note" style="margin-bottom:16px">Trois pistes ressortent de vos réponses. Encore six questions, uniquement sur celles-là, pour choisir la bonne.</div>' : '';
  s.innerHTML='<div class="pad fi"><div style="height:5px;background:var(--surf);border-radius:5px;margin-bottom:22px"><div style="width:'+pct+'%;height:5px;background:var(--gold);border-radius:5px;transition:.3s"></div></div>'+

/* ---------- Écran du jour ---------- */

    gh+=moments.map(function(m){return '<p class="phband" style="margin-top:6px">'+m[0]+'</p>'+codes.slice(m[1],m[2]).map(card).join('');}).join('');

  function db(n){var dis=(ind.sym&&n===6);return '<button class="'+(S.deg===n?'sel':'')+'"'+(dis?' disabled style="opacity:.35"':'')+' onclick="S.deg='+n+';sv();rJ($(\'scr\'))">'+n+'</button>';}

  var head='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><p class="lbl">Jour '+viewing+' · Semaine '+week(viewing)+' · '+phase(viewing)+'</p><span class="chip">'+ind.lb+'</span></div>'+
  '<h2 style="font-size:19px;margin-bottom:14px">'+(S.deg===1?'Votre geste du jour':'Vos '+codes.length+' gestes du jour')+'</h2>';
  var degbar=isPast?'':'<div class="degbar"><p class="lbl">Aujourd’hui</p><div class="seg">'+db(1)+db(3)+db(4)+db(6)+'</div></div>';

  '<textarea rows="3" placeholder="Un mot, si vous le souhaitez. Ou rien." oninput="S.memos['+viewing+']=this.value;sv()">'+memo+'</textarea>';

    (S.day>1?'<button class="btn bs" style="font-size:13px;padding:11px" onclick="viewDay('+(S.day-1)+')">Voir un jour précédent</button>':'')+

/* Relevé du jour : une touche, cinq états, jamais obligatoire.
   Aucun chiffre n'est montré à l'utilisateur, ici ni ailleurs. */
var REL=['Très dur','Difficile','Correct','Plutôt bien','Vraiment bien'];

  '<p class="muted" style="font-size:13px;margin:0 0 9px">Comment elle a été, en un mot. Vous pouvez sauter\u202F: ce n’est pas noté, et ça ne juge pas vos gestes.</p>'+

function expliqueFb(){

}
function setFb(code,v){
  var was=S.fb[code]||0,now=(was===v?0:v);
  S.fb[code]=now;
  if(now===-1){S.fbd[code]=S.day;toast('Écarté. Ce geste ne reviendra plus.');}
  else if(now===1){toast('Retenu. Il vous sera proposé en priorité.');}
  else if(was===-1){delete S.fbd[code];toast('Remis dans la rotation.');}
  else if(was===1){toast('Retiré de vos gestes retenus.');}
  sv();rJ($('scr'));
}
function done(){
  if(S.done.indexOf(S.day)<0){
    var justDone=S.day;
    S.done.push(justDone);
    if(justDone>=28){S.fin=1;sv();go('fin');return;}
    S.day++;sv();
    var w=justDone/7;
    if(w===1||w===2||w===3){if(S.seuils.indexOf(w)<0){S.seuils.push(w);sv();rJ($('scr'));return seuil(w);}}
  }
  rJ($('scr'));
}

}

/* ---------- Comparaison départ / arrivée ---------- */
function peutComparer(){
  if(!S.qhist||S.qhist.length<2)return false;
  return !!(S.qhist[0].scores&&S.qhist[S.qhist.length-1].scores);
}
function rCompare(s){$('nav').innerHTML='';
  if(!peutComparer())return rResult(s);
  var h0=S.qhist[0],h1=S.qhist[S.qhist.length-1];
  var base=h0.scores||{},last=h1.scores||{};
  var keys=Object.keys(IND).sort(function(a,b){return (last[b]||0)-(last[a]||0);}).slice(0,5);
  var dsum=0,dn=0;
  Object.keys(IND).forEach(function(k){if(base[k]!=null&&last[k]!=null){dsum+=last[k]-base[k];dn++;}});
  var delta=dn?dsum/dn:0;

  function barres(k){
    var b=Math.max(3,(base[k]||0)/3*100),l=Math.max(3,(last[k]||0)/3*100);
    return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">'+
    '<span style="font-size:13.5px;font-weight:500">'+IND[k].lb+'</span>'+
    (k===S.parcours?'<span class="chip">votre parcours</span>':'')+'</div>'+
    '<div class="brow"><span class="bl">Départ</span><div class="btr"><div class="bfi" style="width:'+b.toFixed(0)+'%;background:#cfc7b3"></div></div></div>'+
    '<div class="brow"><span class="bl">Aujourd’hui</span><div class="btr"><div class="bfi" style="width:'+l.toFixed(0)+'%;background:var(--gold)"></div></div></div></div>';
  }

  var t,c;
  if(delta<=-0.35){t='C’est plus léger';c='Sur l’ensemble des douze registres, vos réponses sont nettement moins marquées qu’au premier jour. Ce n’est pas rien\u202F: vingt-huit jours, ce n’est pas long, et ce sont des gestes d’une minute qui ont fait ce déplacement.';}
  else if(delta<=-0.1){t='Ça a bougé, un peu';c='Le mouvement est léger, dans le sens du desserrement. C’est le rythme habituel — les micro-gestes travaillent lentement, et l’essentiel de leur effet se voit sur des mois, pas sur quatre semaines.';}
  else if(delta<0.1){t='À peu près au même niveau';c='Vos réponses sont proches de celles du départ. Ce n’est pas un échec\u202F: rester stable pendant une période chargée est déjà un résultat, et ce que vous avez installé ne se lit pas forcément dans un questionnaire. Regardez plutôt si un geste se fait maintenant sans y penser.';}
  else {t='Vos réponses sont plus marquées';c='Elles sont plus fortes qu’au départ. Deux raisons possibles, et la seconde est la plus fréquente\u202F: soit la période est réellement plus dure, soit vous vous voyez plus nettement qu’il y a un mois et vous répondez avec moins de complaisance. On observe souvent ça chez les gens qui ont travaillé sérieusement. Dans les deux cas, ce n’est pas un recul.';}

  var nk=S.suggest;
  s.innerHTML='<div class="pad fi"><div style="height:22px"></div>'+
  '<p class="lbl" style="margin-bottom:10px">Vingt-huit jours plus tard</p>'+
  '<h1 style="font-size:29px;line-height:1.12;margin-bottom:12px">'+t+'</h1>'+
  '<p style="font-size:14px;color:#4d4940;line-height:1.7;margin:0 0 20px">'+c+'</p>'+
  '<div class="card">'+keys.map(barres).join('')+
  '<p style="font-size:12px;color:#6a6456;line-height:1.6;margin:2px 0 0">Les cinq registres les plus présents aujourd’hui. À lire avec prudence\u202F: des réponses fortes un jour donné ont tendance à redescendre d’elles-mêmes à la fois suivante, sans que rien n’ait changé. Le signe le plus fiable n’est pas ici — c’est qu’un geste se fasse maintenant sans que vous ayez à y penser.</p></div>'+
  '<div class="sep"></div>'+
  '<p class="lbl" style="margin-bottom:8px">Le cycle suivant</p>'+
  '<div class="card"><p style="font-size:13.5px;color:#5f5a4d;line-height:1.7;margin:0 0 12px">D’après vos réponses d’aujourd’hui, le parcours qui vous irait le mieux maintenant\u202F: <b>'+IND[nk].lb+'</b>'+(nk===S.parcours?' — le même qu’au départ, ce qui arrive souvent quand le travail n’est pas terminé.':' — différent de celui que vous venez de faire.')+'</p>'+
  '<button class="btn bp" style="margin-bottom:6px" onclick="nouveauCycle(\''+nk+'\')">Commencer ce parcours</button>'+
  '<button class="btn bs" style="margin:0" onclick="go(\'pick2\')">Choisir un autre parcours</button></div>'+
  '<button class="btn bs" style="margin-top:14px" onclick="go(\'fin\')">Plus tard</button></div>';
}

/* Parcours sur mesure : construit uniquement avec les gestes que la personne a
   aimés. Complété par son parcours d'origine si une catégorie est trop maigre. */
function aimes(){var o=[];for(var k in S.fb){if(S.fb[k]===1&&G[k])o.push(k);}return o;}
function peutSurMesure(){
  var a=aimes(),ax={C:0,P:0,E:0};
  a.forEach(function(c){ax[G[c].a]++;});
  return a.length>=4&&(ax.C>0)&&(ax.P+ax.E>=2);
}
function construitSurMesure(){
  var a=aimes(),src=IND[S.parcours]||IND.sur,L={C:[],P:[],E:[]};
  a.forEach(function(c){L[G[c].a].push(c);});
  ['C','P','E'].forEach(function(ax){
    (src[ax]||[]).forEach(function(c){if(L[ax].length<4&&L[ax].indexOf(c)<0&&!ecarte(c,1e9))L[ax].push(c);});
    if(!L[ax].length)L[ax]=src[ax].slice(0,3);
  });
  IND.perso={lb:'Votre sélection',sl:'Vos gestes retenus',sym:0,C:L.C,P:L.P,E:L.E};
  S.persoL=L;
  return L;
}
function lancerSurMesure(){construitSurMesure();nouveauCycle('perso');}

/* Nouveau cycle : on archive le précédent (notes, jours tenus, relevés) et on
   repart à zéro. Les gestes écartés restent écartés — la personne n'a pas changé
   d'avis en changeant de parcours. */
function nouveauCycle(k){
  S.arch.push({cycle:S.cycle,parcours:S.parcours,memos:S.memos,done:S.done,releve:S.releve});

/* Courbe des relevés — volontairement muette : pas d'axe, pas de chiffre,
   pas de moyenne, pas de flèche de tendance. Une ligne qu'on regarde. */
function sparkline(){
  var pts=[],n=0;
  for(var d=1;d<=28;d++){if(typeof S.releve[d]==='number'){pts.push([d,S.releve[d]]);n++;}}
  if(n<3)return '<div class="sep"></div><div class="card"><p class="lbl" style="margin-bottom:8px">La journée</p>'+
    '<p style="font-size:13px;color:#5f5a4d;line-height:1.65;margin:0">Quand vous aurez noté quelques journées, une ligne apparaîtra ici. Elle ne dira rien\u202F: elle montrera, simplement.</p></div>';
  var W=340,H=76,PADX=6,PADY=10;
  function X(d){return PADX+(d-1)/27*(W-2*PADX);}
  function Y(v){return H-PADY-(v/4)*(H-2*PADY);}
  var seg='',prev=null,dots='';
  pts.forEach(function(p){
    if(prev&&p[0]-prev[0]<=3){seg+='<line x1="'+X(prev[0]).toFixed(1)+'" y1="'+Y(prev[1]).toFixed(1)+'" x2="'+X(p[0]).toFixed(1)+'" y2="'+Y(p[1]).toFixed(1)+'" stroke="#C4973A" stroke-width="1.8" stroke-linecap="round"/>';}
    dots+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="2.1" fill="#C4973A"/>';
    prev=p;
  });
  var seps='';
  for(var w=1;w<4;w++){var x=X(w*7+.5).toFixed(1);seps+='<line x1="'+x+'" y1="4" x2="'+x+'" y2="'+(H-4)+'" stroke="#e3ddd0" stroke-width="1"/>';}
  var today='<line x1="'+X(Math.min(S.day,28)).toFixed(1)+'" y1="4" x2="'+X(Math.min(S.day,28)).toFixed(1)+'" y2="'+(H-4)+'" stroke="#d6cdb8" stroke-width="1" stroke-dasharray="2 3"/>';
  return '<div class="sep"></div><div class="card"><p class="lbl" style="margin-bottom:9px">La journée</p>'+
  '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="Ligne de vos relevés quotidiens">'+seps+today+seg+dots+'</svg>'+
  '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px"><span>Jour 1</span><span>Jour 28</span></div>'+
  '<p style="font-size:12.5px;color:#6a6456;line-height:1.6;margin:9px 0 0">Les jours sans relevé sont laissés vides. Une ligne qui monte, qui descend ou qui reste plate ne dit rien de votre travail\u202F: elle dit ce qu’ont été vos journées.</p></div>';
}

function exportNotes(fmt){
  var md=fmt==='md',L=[],h1=md?'# ':'',h2=md?'## ':'',h3=md?'### ':'';
  L.push(h1+'Micro-gestes — mes notes');L.push('');
  function bloc(parcours,memos,done,releve,titre){
    L.push(h2+titre+' — '+IND[parcours].lb);L.push('');
    var days=[];for(var k in memos)days.push(+k);done.forEach(function(d){if(days.indexOf(d)<0)days.push(d)});days.sort(function(a,b){return a-b});
    if(!days.length){L.push('(Aucune note.)');L.push('');return;}
    days.forEach(function(d){
      var tag=[];if(done.indexOf(d)>=0)tag.push('rendez-vous tenu');
      if(typeof releve[d]==='number')tag.push('journée : '+REL[releve[d]].toLowerCase());
      L.push(h3+'Jour '+d+(tag.length?' — '+tag.join(', '):''));
      var m=memos[d];if(m&&m.trim()){L.push('');L.push((md?'> ':'')+m.trim());}L.push('');
    });
  }
  (S.arch||[]).forEach(function(a){bloc(a.parcours,a.memos||{},a.done||[],a.releve||{},'Cycle '+a.cycle);});
  bloc(S.parcours,S.memos,S.done,S.releve,'Cycle '+S.cycle);
  var blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='micro-gestes-notes.'+(md?'md':'txt');document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},800);
}

/* ---------- Accès réservé aux lecteurs ----------
   Phase de test : un code d'accès. Phase 3 : un formulaire (e-mail + question
   sur le livre) qui envoie un lien d'accès. Le volet Trac reste toujours libre. */
var ACCES_SUITE=null;
function accesOK(){return !!(META.acces&&META.acces.deverrouille);}
function exigerAcces(suite){
  if(accesOK())return continuerApresAcces(suite);
  ACCES_SUITE=suite;go('acces');
}
function continuerApresAcces(suite){
  if(suite==='pick')return go('pick');
  return startQuiz();
}
function normaliserCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function codeValide(c){return !!c&&normaliserCode(c)===normaliserCode(CFG.codeTest);}
function deverrouiller(methode){META.acces={deverrouille:true,methode:methode,le:maintenant()};sv();}
function validerCode(){
  var el=$('accesIn'),c=el?el.value:'';
  if(!codeValide(c)){toast('Ce code n’est pas reconnu.');return;}
  deverrouiller('code-test');toast('Bienvenue dans le parcours.');
  var suite=ACCES_SUITE;ACCES_SUITE=null;continuerApresAcces(suite);
}
/* Lien d'accès : …/#acces=CODE (prépare le lien envoyé par e-mail en phase 3) */
function lienAcces(){
  var m=/^#acces=([^&]+)/.exec(location.hash||'');if(!m)return;
  var c=decodeURIComponent(m[1]);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(accesOK())return;
  if(codeValide(c)){deverrouiller('lien');setTimeout(function(){toast('Accès ouvert. Bienvenue.');},700);}
  else setTimeout(function(){toast('Ce lien d’accès n’est pas reconnu.');},700);
}

function notesDe(memos){var l=[];for(var k in (memos||{})){var v=String(memos[k]||'').trim();if(v)l.push([+k,v]);}l.sort(function(a,b){return a[0]-b[0]});return l;}

function carteNote(d,txt,releve,ouvrable){
  var tag=(releve&&typeof releve[d]==='number')?' <span class="muted" style="font-size:12.5px">· journée : '+REL[releve[d]].toLowerCase()+'</span>':'';
  return '<div class="card"><p class="lbl" style="margin-bottom:6px">Jour '+d+tag+'</p>'+
  '<p style="font-size:14px;line-height:1.65;margin:0;white-space:pre-wrap">'+esc(txt)+'</p>'+
  (ouvrable?'<button class="mini" style="margin-top:10px" onclick="viewDay('+d+')">Ouvrir ce jour</button>':'')+'</div>';
}

  h+=cur.length?cur.map(function(n){return carteNote(n[0],n[1],S.releve,n[0]<=S.day);}).join(''):
    '<div class="note">Pas encore de note sur ce parcours. Vous pouvez écrire un mot chaque jour, en bas de l’écran du jour.</div>';
  (S.arch||[]).slice().reverse().forEach(function(a){
    var l=notesDe(a.memos);if(!l.length)return;
    h+='<p class="lbl" style="margin:22px 0 10px">Cycle '+a.cycle+((a.parcours&&IND[a.parcours])?' · '+IND[a.parcours].lb:'')+'</p>';
    h+=l.map(function(n){return carteNote(n[0],n[1],a.releve,false);}).join('');
  });
  s.innerHTML='<div class="pad fi"><div style="height:18px"></div>'+
  '<h2 style="font-size:24px;margin-bottom:6px">Mes notes</h2>'+

  while(rem>=r.ph[pi].d){rem-=r.ph[pi].d;pi++;}
  var p=r.ph[pi],from=BR_MIN;
  for(var i=0;i<pi;i++)if(r.ph[i].t!==null)from=r.ph[i].t;
  var to=p.t===null?from:p.t;
  el.disc.style.transform='scale('+(from+(to-from)*brEase(rem/p.d))+')';
  var key=ci*100+pi;
  if(key!==r.last){r.last=key;el.word.textContent=p.w;el.ring.classList.toggle('hold',p.k==='hold');brTone(p.k,r.cfg.snd,r.cfg.vib);}
  el.count.textContent=Math.min(Math.floor(rem/1000)+1,Math.round(p.d/1000));
  if(r.cfg.dur.c)el.status.textContent=(r.cfg.e.lab||'Cycle')+' '+(ci+1)+' sur '+r.n;
  else{var s=Math.ceil((r.total-t)/1000);el.status.textContent='Encore '+Math.floor(s/60)+' min '+(s%60<10?'0':'')+(s%60);}
  requestAnimationFrame(brTick);
}
function brFinish(){var r=BR.run;r.done=true;brTone('end',r.cfg.snd,r.cfg.vib);var el=r.el;
  el.disc.style.transform='scale('+BR_MIN+')';el.ring.classList.remove('hold');
  el.word.textContent='Respirez normalement';el.word.classList.add('sm');el.count.textContent='';
  el.status.textContent='C’est la répétition qui fait le lien.';el.pause.textContent='Recommencer';
  try{BR.wake&&BR.wake.release()}catch(e){}BR.wake=null;}
function brPause(){var r=BR.run;if(!r)return;
  if(r.done){brStart(r.el,r.cfg);return;}
  if(r.pAt===null){r.pAt=performance.now();r.el.pause.textContent='Reprendre';r.el.status.textContent='En pause';}
  else{r.paused+=performance.now()-r.pAt;r.pAt=null;r.el.pause.textContent='Pause';}}
function brStop(){if(BR.run)BR.run.done=true;BR.run=null;try{BR.wake&&BR.wake.release()}catch(e){}BR.wake=null;}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&BR.run&&!BR.run.done){try{navigator.wakeLock.request('screen').then(function(w){BR.wake=w}).catch(function(){})}catch(e){}}});

/* ---------- Volet trac ---------- */
var TR_OPT={},TR_DUR=null,TR_SND=false,TR_VIB=false;
function trRow(e){return '<div class="card trrow" role="button" tabindex="0" onclick="trOpen(\''+e.id+'\')"><div><div class="trn">'+e.n+'</div><div class="muted" style="font-size:13px">'+e.rh(brDef(e))+'</div></div><span class="trgo" aria-hidden="true"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span></div>';}
function rTrac(s){
  var alone=S.scr==='trac';
  if(alone)$('nav').innerHTML='';
  var inst='';
  if(!STANDALONE){
    if(IS_IOS)inst='<button class="btn bs" onclick="iosHelp()">Installer sur mon téléphone</button>';
    else inst='<button class="btn bs" id="installBtn" style="display:'+(deferredPrompt?'block':'none')+'" onclick="doInstall()">Installer sur mon téléphone</button>';
  }
  s.innerHTML='<div class="pad fi"><div style="height:18px"></div>'+
  '<p class="lbl" style="margin-bottom:6px">Volet trac</p>'+
  '<h2 style="font-size:28px;line-height:1.1;margin-bottom:10px">Gérer le trac</h2>'+
  '<p class="muted" style="margin:0 0 18px">Les respirations et le rituel du livret <i>Gérer le trac, ça se travaille</i>. Choisissez un exercice et suivez le cercle : il grossit quand vous inspirez, rétrécit quand vous expirez, change de couleur quand vous retenez.</p>'+
  '<h3 class="trh">Juste avant la scène</h3>'+
  BREX.filter(function(e){return e.g==='avant'}).map(trRow).join('')+
  '<div class="card"><div class="trn" style="margin-bottom:8px">Le rituel de coulisses</div>'+
  '<p style="font-size:13.5px;color:#5f5a4d;line-height:1.65;margin:0">Toujours le même, toujours dans le même ordre.<br><b>Un geste du corps :</b> rouler les épaules, poser les pieds, un soupir double.<br><b>Un point d’attention :</b> une phrase vraie, une note, un objet dans la poche.<br><b>L’ancre :</b> pouce contre index, dix secondes, juste avant d’entrer.</p></div>'+
  '<h3 class="trh">Au quotidien</h3>'+
  BREX.filter(function(e){return e.g==='quot'}).map(trRow).join('')+
  '<div class="note" style="margin:14px 0">Le livret complet, avec tous les exercices et les études qui les fondent, est sur <a href="https://yannriguidelhypnose.fr/trac/" target="_blank" rel="noopener" style="color:inherit">yannriguidelhypnose.fr/trac</a>.</div>'+
  inst+
  (alone?'<button class="btn bp" onclick="go(\'w\')">Découvrir le programme Micro-gestes</button>':'')+
  '</div>';
}
function trChips(lab,vals,sel,fn){
  return '<p class="lbl" style="margin:14px 0 8px">'+lab+'</p><div class="trchips">'+vals.map(function(v,i){
    return '<button class="trchip'+(i===sel?' on':'')+'" onclick="'+fn+'('+i+',this)">'+v+'</button>';}).join('')+'</div>';
}
function trPick(btn){var p=btn.parentNode.querySelectorAll('.trchip');for(var i=0;i<p.length;i++)p[i].classList.remove('on');btn.classList.add('on');}
function trSetX(i,b){var e=brFind(TR_CUR);TR_OPT[e.extra.key]=e.extra.vals[i][0];trPick(b);}
function trSetD(i,b){TR_DUR=brFind(TR_CUR).dur[i][1];trPick(b);}
var TR_CUR=null;
function trOpen(id){
  var e=brFind(id);TR_CUR=id;TR_OPT=brDef(e);TR_DUR=e.dur[e.dd||0][1];
  var h='<p style="font-size:14px;line-height:1.6;margin:0 0 8px">'+e.how+'</p><p class="muted" style="font-size:13px;margin:0">'+e.why+'</p>';
  if(e.extra)h+=trChips(e.extra.lab,e.extra.vals.map(function(v){return v[1]}),e.extra.def,'trSetX');
  if(e.dur.length>1)h+=trChips('Durée',e.dur.map(function(v){return v[0]}),e.dd||0,'trSetD');
  h+='<div class="trtog"><label><input type="checkbox" id="trSnd"'+(TR_SND?' checked':'')+'> Son à chaque temps</label><label><input type="checkbox" id="trVib"'+(TR_VIB?' checked':'')+'> Vibration</label></div>'+
  '<button class="btn bp" style="margin-top:16px" onclick="trGo()">Commencer</button>';
  var o=sheet('ovT','Respirer',e.n,h);o.style.position='fixed';o.style.left='0';o.style.right='0';o.style.margin='0 auto';o.style.maxWidth='420px';
}
function trGo(){
  TR_SND=$('trSnd').checked;TR_VIB=$('trVib').checked;closeOv('ovT');
  var e=brFind(TR_CUR),ov=document.createElement('div');ov.className='trp';ov.id='ovP';
  ov.innerHTML='<div class="trpt">'+e.n+'</div><div class="trstage"><div class="trring" id="trRing"><div class="trdisc" id="trDisc"></div><div class="trin"><div class="trw" id="trW" aria-live="polite"></div><div class="trc" id="trC"></div></div></div></div>'+
  '<div class="trst" id="trSt"></div><div class="trbt"><button class="btn bs" onclick="trEnd()">Arrêter</button><button class="btn bp" id="trPa" onclick="brPause()">Pause</button></div>';
  $('app').appendChild(ov);
  brStart({disc:$('trDisc'),ring:$('trRing'),word:$('trW'),count:$('trC'),status:$('trSt'),pause:$('trPa')},{e:e,opts:TR_OPT,dur:TR_DUR,snd:TR_SND,vib:TR_VIB});
}
function trEnd(){brStop();var o=$('ovP');if(o)o.remove();}

ld();
lienAcces();
demanderStockageDurable();
if(ALERTE_DONNEES)setTimeout(function(){toast(ALERTE_DONNEES);},600);
if(/^#trac/.test(location.hash)){if(S.scr==='home')S.tab='t';else S.scr='trac';}
render();
